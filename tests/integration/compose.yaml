name: sqlserver-nvim-tests

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: ${SQLSERVER_PLATFORM:-linux/amd64}
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DbPassword:-Test_Password_123}
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - ./seed.sql:/fixtures/seed.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
          -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 15s
